
name: Build Ghostgram IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout Ghostgram
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          python3 --version

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/ghostgram.keychain-db"
          CERT="$RUNNER_TEMP/certificate.p12"

          echo "$P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain \
            -p "$P12_PASSWORD" "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 "$KEYCHAIN"

          security unlock-keychain \
            -p "$P12_PASSWORD" "$KEYCHAIN"

          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$P12_PASSWORD" "$KEYCHAIN"

          security list-keychains \
            -d user -s "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security cms -D -i "$PROFILE" \
            > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$RUNNER_TEMP/profile.plist")

          cp "$PROFILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Check build configuration
        run: |
          test -f build-system/appstore-configuration.json
          test -f build-system/Make/Make.py
          test -d build-system/local-codesigning

      - name: Build Ghostgram
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/local-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-iPhone-IPA
          path: build-output/**/*.ipa
          if-no-files-found: error
          retention-days: 7
